name: AOT cloud build
run-name: aot ${{ inputs.job }} ${{ inputs.release_id }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: build or sign
        required: true
        default: build
      release_id:
        description: draft release id
        required: true
      pub_tag:
        description: publish tag
        required: false
        default: ""
      sealed:
        description: wait for sealed assets
        required: false
        default: "false"
permissions:
  contents: write
env:
  AOT_CLOUD_VERSION: "4"
  GH_TOKEN: ${{ github.token }}
  REL: ${{ inputs.release_id }}
  PUB_TAG: ${{ inputs.pub_tag }}
  SEALED: ${{ inputs.sealed }}
  BT: "36.0.0"
jobs:
  build:
    if: ${{ inputs.job == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Prepare java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Prepare sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$BT" > /dev/null
      - name: Prepare source
        run: |
          python3 -m pip install --quiet cryptography
          python3 .github/aot/aot_cloud.py fetch
          if [ "$SEALED" = "true" ]; then python3 .github/aot/aot_cloud.py seal seal-assets.enc apply; fi
          python3 .github/aot/aot_gradle_gen.py proj build-facts.txt
      - name: Prepare facts
        run: python3 .github/aot/aot_cloud.py env-facts
      - name: Resources
        working-directory: proj
        run: gradle processDebugResources processReleaseResources --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1
      - name: Compile
        working-directory: proj
        run: python3 "$GITHUB_WORKSPACE/.github/aot/aot_cloud.py" compile
      - name: Dex
        working-directory: proj
        run: gradle minifyReleaseWithR8 dexBuilderDebug --console=plain >> "$GITHUB_WORKSPACE/build.log" 2>&1
      - name: Package
        working-directory: proj
        run: gradle assembleDebug assembleRelease bundleRelease --console=plain >> "$GITHUB_WORKSPACE/build.log" 2>&1
      - name: Upload
        run: python3 .github/aot/aot_cloud.py finish-build
      - name: Sign
        run: python3 .github/aot/aot_cloud.py sign-inline
      - name: Report failure
        if: ${{ failure() }}
        run: python3 .github/aot/aot_cloud.py fail
  sign:
    if: ${{ inputs.job == 'sign' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Prepare java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BT" > /dev/null
          python3 -m pip install --quiet cryptography
      - name: Sign
        run: python3 .github/aot/aot_cloud.py sign
      - name: Report failure
        if: ${{ failure() }}
        run: python3 .github/aot/aot_cloud.py fail
